### claritmux — much clearer status bar with window (bell/activity/current/last) and also pane border
# based on @89iuv's great config from https://github.com/catppuccin/tmux/discussions/317#discussioncomment-11064512
# cf. https://github.com/tmux/tmux/wiki/Formats
# cf. https://www.nerdfonts.com/cheat-sheet

# Defaults below are applied via:
#   if -F '#{==:#{@opt},#{@claritmux_prev_opt}}' { set @opt DEFAULT ; set @claritmux_prev_opt <applied> }
# rather than plain `set -o` (only-if-unset), so that re-sourcing this file picks up
# changed defaults. `set -o` would skip them forever once a server has loaded once,
# leaving `prefix + R` unable to apply any theme update without restarting the server.
# Comparing against the last-applied value still leaves genuine user overrides alone.

# Default color palette (mocha-inspired, override with @claritmux_color_* before loading)
if -F '#{==:#{@claritmux_color_bg},#{@claritmux_prev_color_bg}}' { set -g @claritmux_color_bg '#1e1e2e' ; set -gF @claritmux_prev_color_bg '#{@claritmux_color_bg}' }
if -F '#{==:#{@claritmux_color_fg},#{@claritmux_prev_color_fg}}' { set -g @claritmux_color_fg '#9399b2' ; set -gF @claritmux_prev_color_fg '#{@claritmux_color_fg}' }
if -F '#{==:#{@claritmux_color_separator},#{@claritmux_prev_color_separator}}' { set -g @claritmux_color_separator '#6c7086' ; set -gF @claritmux_prev_color_separator '#{@claritmux_color_separator}' }
if -F '#{==:#{@claritmux_color_inactive},#{@claritmux_prev_color_inactive}}' { set -g @claritmux_color_inactive '#6c7086' ; set -gF @claritmux_prev_color_inactive '#{@claritmux_color_inactive}' }
if -F '#{==:#{@claritmux_color_active},#{@claritmux_prev_color_active}}' { set -g @claritmux_color_active '#a6e3a1' ; set -gF @claritmux_prev_color_active '#{@claritmux_color_active}' }
if -F '#{==:#{@claritmux_color_selection},#{@claritmux_prev_color_selection}}' { set -g @claritmux_color_selection '#94e2d5' ; set -gF @claritmux_prev_color_selection '#{@claritmux_color_selection}' }
if -F '#{==:#{@claritmux_color_bell},#{@claritmux_prev_color_bell}}' { set -g @claritmux_color_bell '#f38ba8' ; set -gF @claritmux_prev_color_bell '#{@claritmux_color_bell}' }
if -F '#{==:#{@claritmux_color_prefix},#{@claritmux_prev_color_prefix}}' { set -g @claritmux_color_prefix '#89dceb' ; set -gF @claritmux_prev_color_prefix '#{@claritmux_color_prefix}' }
if -F '#{==:#{@claritmux_color_session},#{@claritmux_prev_color_session}}' { set -g @claritmux_color_session '#585b70' ; set -gF @claritmux_prev_color_session '#{@claritmux_color_session}' }
if -F '#{==:#{@claritmux_color_path},#{@claritmux_prev_color_path}}' { set -g @claritmux_color_path '#89b4fa' ; set -gF @claritmux_prev_color_path '#{@claritmux_color_path}' }
if -F '#{==:#{@claritmux_color_message},#{@claritmux_prev_color_message}}' { set -g @claritmux_color_message '#f8a06a' ; set -gF @claritmux_prev_color_message '#{@claritmux_color_message}' }
if -F '#{==:#{@claritmux_color_date},#{@claritmux_prev_color_date}}' { set -g @claritmux_color_date '#f9e2af' ; set -gF @claritmux_prev_color_date '#{@claritmux_color_date}' }
if -F '#{==:#{@claritmux_color_day},#{@claritmux_prev_color_day}}' { set -g @claritmux_color_day '#fab387' ; set -gF @claritmux_prev_color_day '#{@claritmux_color_day}' }
if -F '#{==:#{@claritmux_color_time},#{@claritmux_prev_color_time}}' { set -g @claritmux_color_time '#f38ba8' ; set -gF @claritmux_prev_color_time '#{@claritmux_color_time}' }
if -F '#{==:#{@claritmux_color_timezone},#{@claritmux_prev_color_timezone}}' { set -g @claritmux_color_timezone '#45475a' ; set -gF @claritmux_prev_color_timezone '#{@claritmux_color_timezone}' }
if -F '#{==:#{@claritmux_color_host},#{@claritmux_prev_color_host}}' { set -g @claritmux_color_host '#585b70' ; set -gF @claritmux_prev_color_host '#{@claritmux_color_host}' }

if -F '#{==:#{@claritmux_status_workdir},#{@claritmux_prev_status_workdir}}' { set -g @claritmux_status_workdir 1 ; set -gF @claritmux_prev_status_workdir '#{@claritmux_status_workdir}' }
if -F '#{==:#{@claritmux_status_date},#{@claritmux_prev_status_date}}' { set -g @claritmux_status_date 1 ; set -gF @claritmux_prev_status_date '#{@claritmux_status_date}' }
if -F '#{==:#{@claritmux_status_time},#{@claritmux_prev_status_time}}' { set -g @claritmux_status_time 1 ; set -gF @claritmux_prev_status_time '#{@claritmux_status_time}' }
if -F '#{==:#{@claritmux_status_hostname},#{@claritmux_prev_status_hostname}}' { set -g @claritmux_status_hostname 1 ; set -gF @claritmux_prev_status_hostname '#{@claritmux_status_hostname}' }

if -F '#{==:#{@claritmux_style_status},#{@claritmux_prev_style_status}}' { set -gF @claritmux_style_status 'bg=#{@claritmux_color_bg}' ; set -gF @claritmux_prev_style_status '#{@claritmux_style_status}' }
if -F '#{==:#{@claritmux_style_status_separator},#{@claritmux_prev_style_status_separator}}' { set -gF @claritmux_style_status_separator 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_separator},none' ; set -gF @claritmux_prev_style_status_separator '#{@claritmux_style_status_separator}' }
if -F '#{==:#{@claritmux_style_status_while_prefix},#{@claritmux_prev_style_status_while_prefix}}' { set -gF @claritmux_style_status_while_prefix 'bg=#{@claritmux_color_prefix},fg=#{@claritmux_color_bg},bold' ; set -gF @claritmux_prev_style_status_while_prefix '#{@claritmux_style_status_while_prefix}' }
if -F '#{==:#{@claritmux_style_status_session},#{@claritmux_prev_style_status_session}}' { set -gF @claritmux_style_status_session 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_session}' ; set -gF @claritmux_prev_style_status_session '#{@claritmux_style_status_session}' }
if -F '#{==:#{@claritmux_style_status_path},#{@claritmux_prev_style_status_path}}' { set -gF @claritmux_style_status_path 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_path}' ; set -gF @claritmux_prev_style_status_path '#{@claritmux_style_status_path}' }
if -F '#{==:#{@claritmux_style_status_date},#{@claritmux_prev_style_status_date}}' { set -gF @claritmux_style_status_date 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_date}' ; set -gF @claritmux_prev_style_status_date '#{@claritmux_style_status_date}' }
if -F '#{==:#{@claritmux_style_status_day},#{@claritmux_prev_style_status_day}}' { set -gF @claritmux_style_status_day 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_day}' ; set -gF @claritmux_prev_style_status_day '#{@claritmux_style_status_day}' }
if -F '#{==:#{@claritmux_style_status_time},#{@claritmux_prev_style_status_time}}' { set -gF @claritmux_style_status_time 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_time}' ; set -gF @claritmux_prev_style_status_time '#{@claritmux_style_status_time}' }
if -F '#{==:#{@claritmux_style_status_timezone},#{@claritmux_prev_style_status_timezone}}' { set -gF @claritmux_style_status_timezone 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_timezone}' ; set -gF @claritmux_prev_style_status_timezone '#{@claritmux_style_status_timezone}' }
if -F '#{==:#{@claritmux_style_status_host},#{@claritmux_prev_style_status_host}}' { set -gF @claritmux_style_status_host 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_host}' ; set -gF @claritmux_prev_style_status_host '#{@claritmux_style_status_host}' }
if -F '#{==:#{@claritmux_style_window_status},#{@claritmux_prev_style_window_status}}' { set -gF @claritmux_style_window_status 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_fg}' ; set -gF @claritmux_prev_style_window_status '#{@claritmux_style_window_status}' }
if -F '#{==:#{@claritmux_style_window_current},#{@claritmux_prev_style_window_current}}' { set -gF @claritmux_style_window_current 'bg=#{@claritmux_color_active},fg=#{@claritmux_color_bg},bold' ; set -gF @claritmux_prev_style_window_current '#{@claritmux_style_window_current}' }
if -F '#{==:#{@claritmux_style_window_last},#{@claritmux_prev_style_window_last}}' { set -gF @claritmux_style_window_last 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_active},bold' ; set -gF @claritmux_prev_style_window_last '#{@claritmux_style_window_last}' }
if -F '#{==:#{@claritmux_style_window_bell},#{@claritmux_prev_style_window_bell}}' { set -gF @claritmux_style_window_bell 'bg=#{@claritmux_color_bell},blink,fg=#{@claritmux_color_bg},blink' ; set -gF @claritmux_prev_style_window_bell '#{@claritmux_style_window_bell}' }
if -F '#{==:#{@claritmux_style_pane_active},#{@claritmux_prev_style_pane_active}}' { set -gF @claritmux_style_pane_active 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_active},bold' ; set -gF @claritmux_prev_style_pane_active '#{@claritmux_style_pane_active}' }
if -F '#{==:#{@claritmux_style_pane_active_border},#{@claritmux_prev_style_pane_active_border}}' { set -gF @claritmux_style_pane_active_border 'bg=#{@claritmux_color_active},fg=#{@claritmux_color_active}' ; set -gF @claritmux_prev_style_pane_active_border '#{@claritmux_style_pane_active_border}' }
if -F '#{==:#{@claritmux_style_pane_inactive},#{@claritmux_prev_style_pane_inactive}}' { set -gF @claritmux_style_pane_inactive 'bg=#{@claritmux_color_inactive},fg=#{@claritmux_color_bg}' ; set -gF @claritmux_prev_style_pane_inactive '#{@claritmux_style_pane_inactive}' }
if -F '#{==:#{@claritmux_style_pane_inactive_border},#{@claritmux_prev_style_pane_inactive_border}}' { set -gF @claritmux_style_pane_inactive_border 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_inactive}' ; set -gF @claritmux_prev_style_pane_inactive_border '#{@claritmux_style_pane_inactive_border}' }
if -F '#{==:#{@claritmux_style_message},#{@claritmux_prev_style_message}}' { set -gF @claritmux_style_message 'bg=#{@claritmux_color_message},fg=#{@claritmux_color_bg},fill=#{@claritmux_color_message},bold' ; set -gF @claritmux_prev_style_message '#{@claritmux_style_message}' }
if -F '#{==:#{@claritmux_style_mode},#{@claritmux_prev_style_mode}}' { set -gF @claritmux_style_mode 'bg=#{@claritmux_color_selection},fg=#{@claritmux_color_bg},bold' ; set -gF @claritmux_prev_style_mode '#{@claritmux_style_mode}' }
if -F '#{==:#{@claritmux_style_menu},#{@claritmux_prev_style_menu}}' { set -gF @claritmux_style_menu 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_fg}' ; set -gF @claritmux_prev_style_menu '#{@claritmux_style_menu}' }
if -F '#{==:#{@claritmux_style_menu_selected},#{@claritmux_prev_style_menu_selected}}' { set -gF @claritmux_style_menu_selected 'bg=#{@claritmux_color_selection},fg=#{@claritmux_color_bg},bold' ; set -gF @claritmux_prev_style_menu_selected '#{@claritmux_style_menu_selected}' }
if -F '#{==:#{@claritmux_style_menu_border},#{@claritmux_prev_style_menu_border}}' { set -gF @claritmux_style_menu_border 'bg=#{@claritmux_color_bg},fg=#{@claritmux_color_separator}' ; set -gF @claritmux_prev_style_menu_border '#{@claritmux_style_menu_border}' }
if -F '#{==:#{@claritmux_style_copy_match},#{@claritmux_prev_style_copy_match}}' { set -gF @claritmux_style_copy_match 'bg=#{@claritmux_color_prefix},fg=#{@claritmux_color_bg}' ; set -gF @claritmux_prev_style_copy_match '#{@claritmux_style_copy_match}' }
if -F '#{==:#{@claritmux_style_copy_current_match},#{@claritmux_prev_style_copy_current_match}}' { set -gF @claritmux_style_copy_current_match 'bg=#{@claritmux_color_message},fg=#{@claritmux_color_bg},bold' ; set -gF @claritmux_prev_style_copy_current_match '#{@claritmux_style_copy_current_match}' }
if -F '#{==:#{@claritmux_style_copy_mark},#{@claritmux_prev_style_copy_mark}}' { set -gF @claritmux_style_copy_mark 'bg=#{@claritmux_color_bell},fg=#{@claritmux_color_bg}' ; set -gF @claritmux_prev_style_copy_mark '#{@claritmux_style_copy_mark}' }

if -F '#{==:#{@claritmux_window_name_maxlen},#{@claritmux_prev_window_name_maxlen}}' { set -g @claritmux_window_name_maxlen 12 ; set -gF @claritmux_prev_window_name_maxlen '#{@claritmux_window_name_maxlen}' }
if -F '#{==:#{@claritmux_window_name_maxlen_current},#{@claritmux_prev_window_name_maxlen_current}}' { set -g @claritmux_window_name_maxlen_current 999 ; set -gF @claritmux_prev_window_name_maxlen_current '#{@claritmux_window_name_maxlen_current}' }

# window name/path formats (built from maxlen settings above)
# inactive windows: truncate from right to maxlen chars
set -gF   @claritmux_format_window_named         ' ##{=/#{@claritmux_window_name_maxlen}/…:##{window_name}}'
set -gF   @claritmux_format_window_unnamed       ' ##{=/#{@claritmux_window_name_maxlen}/…:##{b:pane_current_path}}'
# active window: truncate from right to maxlen_current chars (999 = effectively no limit)
set -gF   @claritmux_format_window_named_current   ' ##{=/#{@claritmux_window_name_maxlen_current}/…:##{window_name}}'
set -gF   @claritmux_format_window_unnamed_current ' ##{=/#{@claritmux_window_name_maxlen_current}/…:##{b:pane_current_path}}'

set -ogq status-position bottom
set -ogq status-justify left  # or absolute-centre, right

## status left look and feel
set -ogq status-left-length 100
set -gF status-style "#{@claritmux_style_status}"
set -g status-left ""
set -ga status-left "#[#{@claritmux_style_status_session}]"
# show prefix status
set -ga status-left "#{?client_prefix,#{#[#{@claritmux_style_status_while_prefix}]},}"
# show session
set -ga status-left "  #{=/32/...:#{session_name}} "
# last separator
set -ga status-left "#[#{@claritmux_style_status_separator}]│"

## status right look and feel
set -g status-right-length 100
set -g status-right ""
# workdir
set -ga status-right "#{?#{@claritmux_status_workdir},#{#[#{@claritmux_style_status_separator}]}│#{#[#{@claritmux_style_status_path}]}  #{=/-32/...:#{s|$HOME|~|:#{pane_current_path}}} ,}"
# date/time group separator
set -ga status-right "#{?#{||:#{@claritmux_status_date},#{@claritmux_status_time}},#{#[#{@claritmux_style_status_separator}]}│,}"
# date
set -ga status-right "#{?#{@claritmux_status_date}, #{#[#{@claritmux_style_status_date}]}󰭦 %Y-%m-%d#{#[#{@claritmux_style_status_day}]} %a,}"
# time
set -ga status-right "#{?#{@claritmux_status_time}, #{#[#{@claritmux_style_status_time}]}󰅐 %H:%M:%S#{#[#{@claritmux_style_status_timezone}]} %Z,}"
# date/time group trailing space
set -ga status-right "#{?#{||:#{@claritmux_status_date},#{@claritmux_status_time}}, ,}"
set -g  status-interval 1
# hostname
set -ga status-right "#{?#{@claritmux_status_hostname},#{#[#{@claritmux_style_status_separator}]}│#{#[#{@claritmux_style_status_host}]} 󰒍 #h ,}"

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -gF window-status-format         " ##I##{?##{!=:##{window_name},##{b:pane_current_path}},#{@claritmux_format_window_named},#{@claritmux_format_window_unnamed}} "
set -gF window-status-current-format " ##I##{?##{!=:##{window_name},##{b:pane_current_path}},#{@claritmux_format_window_named_current},#{@claritmux_format_window_unnamed_current}} "
set -gF window-status-separator      "#[#{@claritmux_style_status_separator}]│#[default]"
set -gF window-status-style          "#{@claritmux_style_window_status}"
set -gF window-status-current-style  "#{@claritmux_style_window_current}"
set -gF window-status-last-style     "#{@claritmux_style_window_last}"
set -gF window-status-activity-style ""
set -gF window-status-bell-style     "#{@claritmux_style_window_bell}"

# message (display-message / command-prompt) look and feel
set -gF message-style         "#{@claritmux_style_message}"
set -gF message-command-style "#{@claritmux_style_message}"

# selections (copy-mode/choose-tree) and menus look and feel
set -gF mode-style                    "#{@claritmux_style_mode}"
set -gF menu-style                    "#{@claritmux_style_menu}"
set -gF menu-selected-style           "#{@claritmux_style_menu_selected}"
set -gF menu-border-style             "#{@claritmux_style_menu_border}"
set -gF copy-mode-match-style         "#{@claritmux_style_copy_match}"
set -gF copy-mode-current-match-style "#{@claritmux_style_copy_current_match}"
set -gF copy-mode-mark-style          "#{@claritmux_style_copy_mark}"

# choose-tree (session/window picker) window rows: same current/last/bell
# colors as the status bar, layered onto tmux's own default -F template
# (extracted from the tmux binary; kept intact except for the color prefix).
# The whole thing has to be inlined into each bind below rather than kept in
# a @claritmux_* option: choose-tree's -F is only expanded once per row, and
# a bare #{@name} reference only substitutes the stored text without
# re-evaluating the #{...} inside it (see FORMATS in tmux(1) re "E:").
bind -N 'Choose a session from a list' s { choose-tree -Zs -F '#{?pane_format,#{?pane_marked,#[reverse],}#{?pane_floating_flag,#[italics],}#{pane_current_command}#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?window_bell_flag,#{#[#{@claritmux_style_window_bell}]},#{?window_active,#{#[#{@claritmux_style_window_current}]},#{?window_last_flag,#{#[#{@claritmux_style_window_last}]},}}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}' }
bind -N 'Choose a window from a list'  w { choose-tree -Zw -F '#{?pane_format,#{?pane_marked,#[reverse],}#{?pane_floating_flag,#[italics],}#{pane_current_command}#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?window_bell_flag,#{#[#{@claritmux_style_window_bell}]},#{?window_active,#{#[#{@claritmux_style_window_current}]},#{?window_last_flag,#{#[#{@claritmux_style_window_last}]},}}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}' }

# pane border look and feel
setw -g pane-border-status top
setw -g  pane-border-format ""
# TODO show zoom status and title when zoomed or only one pane
setw -ga pane-border-format "#{?pane_active,#{#[#{@claritmux_style_pane_active}]},#{#[#{@claritmux_style_pane_inactive}]}}"
setw -ga pane-border-format " "
setw -ga pane-border-format "#{?window_zoomed_flag,  ,}"
setw -ga pane-border-format " #P: #{pane_current_command} "
setw -ga pane-border-format "│"
setw -ga pane-border-format " #T "
setw -ga pane-border-format " "
setw -ga pane-border-format "#[default]"
setw -gF pane-active-border-style "#{@claritmux_style_pane_active_border}"
setw -gF pane-border-style        "#{@claritmux_style_pane_inactive_border}"
setw -g pane-border-lines single

# vim:ft=tmux
